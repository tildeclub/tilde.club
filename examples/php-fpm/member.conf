[tilde-member]
user = member
group = member
listen = /run/php-fpm/tilde-member.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 500
request_terminate_timeout = 60s
clear_env = yes
security.limit_extensions = .php
php_admin_value[memory_limit] = 128M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[session.save_path] = /home/member/.local/state/php/sessions
