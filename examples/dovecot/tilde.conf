# Standalone NEW-HOST example for Dovecot 2.4 and local Unix accounts.
# Replace domain/cert paths and review the distro's /etc/pam.d/dovecot.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0
protocols {
  imap = yes
  lmtp = yes
}
auth_mechanisms = plain login
auth_username_format = %{user | username | lower}
passdb pam {
  service_name = dovecot
}
userdb passwd {
}
mail_home = /home/%{user | username}
first_valid_uid = 1000
mail_driver = maildir
mail_path = ~/.mail
ssl = required
ssl_min_protocol = TLSv1.2
ssl_server_cert_file = /etc/letsencrypt/live/tilde.example.net/fullchain.pem
ssl_server_key_file = /etc/letsencrypt/live/tilde.example.net/privkey.pem
namespace inbox {
  inbox = yes
  separator = /
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    user = postfix
    group = postfix
    mode = 0660
  }
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    user = postfix
    group = postfix
    mode = 0600
  }
}
protocol lmtp {
  postmaster_address = postmaster@tilde.example.net
  mail_plugins {
    sieve = yes
  }
}
sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}
